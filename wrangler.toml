# Cloudflare Pages configuration.
#
# Deployment is driven by Cloudflare's Git integration (or `wrangler pages
# deploy`) — NOT by GitHub Actions. There is no .github/workflows directory in
# this repository and none is required.
name = "telegram-to-json"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# Workers KV namespace holding the single "feed" key.
# Create it once:  npx wrangler kv namespace create FEED
# then paste the returned id below (and a preview_id for local/preview runs).
[[kv_namespaces]]
binding = "FEED"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_PREVIEW_KV_NAMESPACE_ID"

# Non-secret defaults. Secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET)
# are configured in the Cloudflare dashboard and MUST NOT appear here.
[vars]
POST_LIMIT = "20"
CACHE_TTL_SECONDS = "60"
ALLOWED_ORIGINS = "*"
TELEGRAM_CHANNEL_USERNAME = "chfless"
